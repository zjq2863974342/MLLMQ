dataset_path: ../data/benchmarks_local/lmms-lab/textvqa
# local dataset, no HF hub token needed
task: textvqa_val_local
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.textvqa_doc_to_visual
doc_to_text: !function utils.textvqa_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  until:
    - "ASSISTANT:"
process_results: !function utils.textvqa_process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  # submission metric removed — textvqa_aggregate_submissions needs args.output_path
# which lmms-eval simple_evaluate doesn't pass, causing all results to be lost.
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
    ocr: false
