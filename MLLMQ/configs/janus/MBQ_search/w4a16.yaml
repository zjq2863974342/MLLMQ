# Janus-Pro-7B W4A16 weight-only quantization (default config)
# Equivalent to: python main_quant.py --w_bit 4 --calib_data pileval --n_samples 128 --run_process --pack_quant

# model args
model: janus
model_path: Janus/models/Janus-Pro-7B

# calibration data args
calib_data: pileval
n_samples: 128

# quantization config
method: mbq
run_process: true
w_bit: 4
a_bit: 16
w_group: 128
distort: false
reweight: false
loss_mode: mae

# output args
pack_quant: true
scale_path: scale_cache/mbq/janus_w4a16.pt
output_path: ../output/janus-pro-7b/models/Janus-Pro-7B-mbq-w4a16