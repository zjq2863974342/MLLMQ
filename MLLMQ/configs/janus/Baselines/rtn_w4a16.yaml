# Janus-Pro-7B RTN W4A16 baseline (round-to-nearest, no scale search)
# Equivalent to: python main_quant.py --method rtn --w_bit 4 --run_process --pack_quant

model: janus
model_path: Janus/models/Janus-Pro-7B

calib_data: pileval
n_samples: 128

method: rtn
run_process: true
w_bit: 4
a_bit: 16
w_group: 128

pack_quant: true
scale_path: scale_cache/rtn/janus_w4a16.pt
output_path: ../output/janus-pro-7b/models/Janus-Pro-7B-rtn-w4a16