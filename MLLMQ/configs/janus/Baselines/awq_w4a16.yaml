calib_data: pileval
n_samples: 128

method: awq
run_process: true
w_bit: 4
a_bit: 16
w_group: 128

pack_quant: true
scale_path: scale_cache/awq/janus_w4a16.pt
output_path: ../output/janus-pro-7b/models/Janus-Pro-7B-awq-w4a16