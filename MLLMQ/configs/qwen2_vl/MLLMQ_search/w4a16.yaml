# Qwen2-VL-7B MLLMQ W4A16 (COCO multimodal calib + per-channel gradient reweighting)
# Equivalent to: python main_quant_vl.py --model_type qwen2_vl --method mllmq --w_bit 4 --calib_data coco --run_process --pack_quant
#
# Key difference from MBQ: MLLMQ uses per-channel (not per-layer) gradient-based
# modality reweighting during scale search.

model_type: qwen2_vl
model_path: /path/to/Qwen2-VL-7B-Instruct

calib_data: coco
data_path: /path/to/coco/annotations/captions_train2014.json
image_folder: /path/to/coco/train2014
n_samples: 128

method: mllmq
run_process: true
w_bit: 4
a_bit: 16
w_group: 128
distort: false
loss_mode: mae

pack_quant: true
scale_path: scale_cache/mllmq/qwen2_vl_w4a16.pt
output_path: /path/to/output/Qwen2-VL-7B-mllmq-w4a16