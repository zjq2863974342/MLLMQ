# Qwen2-VL-7B RTN W4A16 baseline (accuracy lower bound)
# Equivalent to: python main_quant_vl.py --model_type qwen2_vl --method rtn --w_bit 4 --calib_data coco --run_process --pack_quant

model_type: qwen2_vl
model_path: /path/to/Qwen2-VL-7B-Instruct

calib_data: coco
data_path: /path/to/coco/annotations/captions_train2014.json
image_folder: /path/to/coco/train2014
n_samples: 128

method: rtn
run_process: true
w_bit: 4
a_bit: 16
w_group: 128

pack_quant: true
scale_path: scale_cache/rtn/qwen2_vl_w4a16.pt
output_path: /path/to/output/Qwen2-VL-7B-rtn-w4a16