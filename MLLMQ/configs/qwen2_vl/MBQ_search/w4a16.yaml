# Qwen2-VL-7B W4A16 weight-only quantization (MBQ, no reweight)
# Equivalent to: python main_quant_vl.py --model_type qwen2_vl --w_bit 4 --calib_data coco --n_samples 128 --run_process --pack_quant

# model args
model_type: qwen2_vl
model_path: /path/to/Qwen2-VL-7B-Instruct

# calibration data args
calib_data: coco
data_path: /path/to/coco/annotations/captions_train2014.json
image_folder: /path/to/coco/train2014
n_samples: 128

# quantization config
method: mbq
run_process: true
w_bit: 4
a_bit: 16
w_group: 128
distort: false
reweight: false
loss_mode: mae

# output args
pack_quant: true
scale_path: scale_cache/mbq/qwen2_vl_w4a16.pt
output_path: /path/to/output/Qwen2-VL-7B-mbq-w4a16