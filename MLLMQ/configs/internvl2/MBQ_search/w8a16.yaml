# InternVL2-8B MBQ W8A16 near-lossless baseline
model_type: internvl2
model_path: /path/to/InternVL2-8B

calib_data: coco
data_path: /path/to/coco/annotations/captions_train2014.json
image_folder: /path/to/coco/train2014
n_samples: 128

method: mbq
run_process: true
w_bit: 8
a_bit: 16
w_group: 128
distort: false
loss_mode: mae

pack_quant: true
scale_path: scale_cache/mbq/internvl2_w8a16.pt
output_path: ../output/internvl2/mbq-w8a16